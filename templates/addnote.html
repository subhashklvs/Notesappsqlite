{% extends 'base.html' %}
{% block title %}Add Note — NotesApp{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
  <div class="col-md-8 col-lg-7">
    <div class="card">
      <div class="card-header">
        <i class="bi bi-plus-circle me-2"></i>Add New Note
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('addnote') }}">
          <div class="mb-3">
            <label for="title">Note Title</label>
            <input type="text" class="form-control mt-1" id="title" name="title"
                   placeholder="Give your note a title…" required autofocus/>
          </div>
          <div class="mb-4">
            <label for="content">Content</label>
            <textarea class="form-control mt-1" id="content" name="content"
                      rows="8" placeholder="Write your note here…" required></textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-save me-2"></i>Save Note
            </button>
            <a href="{{ url_for('viewall') }}" class="btn btn-secondary px-4">
              <i class="bi bi-x-lg me-1"></i>Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
