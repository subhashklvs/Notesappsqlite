{% extends 'base.html' %}
{% block title %}Edit Note — NotesApp{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
  <div class="col-md-8 col-lg-7">
    <div class="card">
      <div class="card-header">
        <i class="bi bi-pencil-square me-2"></i>Edit Note
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('updatenote', note_id=note.id) }}">
          <div class="mb-3">
            <label for="title">Note Title</label>
            <input type="text" class="form-control mt-1" id="title" name="title"
                   value="{{ note.title }}" required autofocus/>
          </div>
          <div class="mb-4">
            <label for="content">Content</label>
            <textarea class="form-control mt-1" id="content" name="content"
                      rows="8" required>{{ note.content }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning px-4">
              <i class="bi bi-check-lg me-2"></i>Update Note
            </button>
            <a href="{{ url_for('viewall') }}" class="btn btn-secondary px-4">
              <i class="bi bi-x-lg me-1"></i>Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
