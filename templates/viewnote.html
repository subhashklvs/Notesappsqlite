{% extends 'base.html' %}
{% block title %}{{ note.title }} — NotesApp{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
  <div class="col-md-8 col-lg-7">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-journal-text me-2"></i>{{ note.title }}</span>
        <small class="opacity-75">
          <i class="bi bi-clock me-1"></i>
          {{ note.created_at.strftime('%d %B %Y, %I:%M %p') }}
        </small>
      </div>
      <div class="card-body p-4">
        <p style="line-height:1.8; white-space:pre-wrap; font-size:1rem;">{{ note.content }}</p>
        <hr/>
        <div class="d-flex gap-2">
          <a href="{{ url_for('updatenote', note_id=note.id) }}" class="btn btn-warning">
            <i class="bi bi-pencil me-2"></i>Edit Note
          </a>
          <a href="{{ url_for('deletenote', note_id=note.id) }}" class="btn btn-danger"
             onclick="return confirm('Delete this note?')">
            <i class="bi bi-trash me-2"></i>Delete
          </a>
          <a href="{{ url_for('viewall') }}" class="btn btn-secondary ms-auto">
            <i class="bi bi-arrow-left me-1"></i>Back
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
